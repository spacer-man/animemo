[project]
name = "animemo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "spacer-man", email = "138325192+spacer-man@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "msgspec>=0.22.0",
    "msgspec-ext>=0.5.1",
    "sqlalchemy[asyncio]>=2.1.9",
]

[project.scripts]
animemo = "animemo:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "ruff>=0.17.6",
]
